<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Password - MGU Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, #4facfe, #9b59b6, #e056fd); display: flex; flex-direction: column; }
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(210deg, rgba(255,255,255,0.05) 25%, transparent 25%), 
                  linear-gradient(120deg, rgba(255,255,255,0.05) 25%, transparent 25%);
      background-size: 300px 300px;
      mix-blend-mode: overlay;
      pointer-events: none;
    }
    .mgu-header { width: 100%; background-color: #fff; z-index: 1; }
    .mgu-header img { width: 100%; height: auto; display: block; }
    .audit-bar { background-color: #0047b3; text-align: center; padding: 10px; z-index: 1; }
    .audit-bar span { color: white; font-weight: bold; font-size: 18px; letter-spacing: 1px; }
    .form-section { flex: 1; display: flex; justify-content: center; align-items: center; padding: 10px; margin-top: 20px; }
    .register-card {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 25px rgba(0,0,0,0.35);
      width: 100%;
      max-width: 420px;
      color: white;
    }
    .row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    label { font-weight: bold; font-size: 14px; }
    input { width: 100%; padding: 10px 12px; border: none; border-radius: 8px; font-size: 14px; outline: none; }
    .btn-primary {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      background-color: #87CEFA;
      color: white;
      transition: background 0.3s;
    }
    .btn-primary:hover { background-color: #1E90FF; }
    .msg { font-size: 13px; text-align: center; margin-top: 6px; }
    .msg.success { color: #bfecc9; }
    .msg.error { color: #ffb3b3; }
    .msg.warn { color: #fff3b0; }
    @media (max-width: 480px) { .register-card { padding: 20px 15px; } }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="mgu-header">
    <img src="D:/AUDIT/header.jpg" alt="Mahatma Gandhi University Header">
  </div>

  <!-- Audit Bar -->
  <div class="audit-bar">
    <span>AUTOMATED ACADEMIC AUDITING SYSTEM</span>
  </div>

  <!-- Form Section -->
  <div class="form-section">
    <div class="register-card">
      <form id="passwordForm" autocomplete="off">
        <div class="row">
          <label for="password">New Password :</label>
          <input id="password" type="password" placeholder="Enter your new password" />
        </div>
        <div class="row">
          <label for="confirm">Confirm Password :</label>
          <input id="confirm" type="password" placeholder="Re-enter new password" />
        </div>
        <button class="btn-primary" type="submit">Register</button>
        <div id="msg" class="msg"></div>
      </form>
    </div>
  </div>

  <script>
    // Load centralized API helper
    (function loadConfig(){
      const s = document.createElement('script');
      s.src = 'js/config.js';
      s.defer = true;
      document.head.appendChild(s);
    })();
    const form = document.getElementById('passwordForm');
    const msg = document.getElementById('msg');
    const passwordField = document.getElementById('password');
    const confirmField = document.getElementById('confirm');

    function setMsg(text='', type='') {
      msg.textContent = text;
      msg.className = 'msg' + (type ? ' ' + type : '');
    }

    function validatePassword(pwd) {
      const pattern = /^(?=.{8,}$)(?=.*[!@#$%^&*()_\-+=[\]{};':"\\|,.<>/?]).*$/;
      return pattern.test(pwd);
    }

    const params = new URLSearchParams(window.location.search);
    const emailVal = params.get("email") || "";
    const nameVal = params.get("user") || "";

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      setMsg('');
      const pwd = (passwordField.value || '').trim();
      const confirm = (confirmField.value || '').trim();

      if (!pwd || !confirm) {
        setMsg('Both fields are required.', 'warn');
        return;
      }

      if (!validatePassword(pwd)) {
        setMsg('Password must be at least 8 characters and include a special character.', 'warn');
        return;
      }

      if (pwd !== confirm) {
        setMsg('Passwords do not match.', 'warn');
        return;
      }

      try {
        let data;
        if (typeof makeRequest === 'function') {
          data = await makeRequest(API_CONFIG.ENDPOINTS.SET_PASSWORD, 'POST', { email: emailVal, password: pwd });
        } else {
          const res = await fetch('http://localhost:8080/set-new-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: emailVal, password: pwd }) });
          data = await res.json();
        }

        if (data && data.success) {
          setMsg('Password updated successfully! Redirecting to dashboard...', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 800);
        } else {
          setMsg(data && data.message ? data.message : 'Failed to update password.', 'error');
        }
      } catch (err) {
        setMsg('❌ Error connecting to server.', 'error');
      }
    });

    // Prevent browser from showing cached version
    window.addEventListener('pageshow', function (event) {
      if (event.persisted || performance.getEntriesByType("navigation")[0].type === "back_forward") {
        window.location.reload();
      }
    });
  </script>
</body>
</html>
