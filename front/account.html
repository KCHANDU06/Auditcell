<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account Details - Audit Cell</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; height: 100vh; background: linear-gradient(135deg, #4facfe, #9b59b6, #e056fd);
           display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; position: relative; }
    body::before {
      content: "";
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(210deg, rgba(255,255,255,0.05) 25%, transparent 25%),
                  linear-gradient(120deg, rgba(255,255,255,0.05) 25%, transparent 25%);
      background-size: 300px 300px;
      mix-blend-mode: overlay;
      pointer-events: none;
    }
    .card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 380px;
      text-align: left;
      z-index: 1;
    }
    .card h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #fff;
    }
    .info-item {
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.3);
      padding-bottom: 8px;
    }
    .back-link {
      margin-top: 20px;
      display: block;
      text-align: center;
      color: #ffcc66;
      text-decoration: none;
      font-weight: bold;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Account Details</h2>
    <div class="info-item"><span>Username:</span><span id="username">Loading...</span></div>
    <div class="info-item"><span>Password:</span><span>••••••••</span></div>
    <div class="info-item"><span>Last Login:</span><span id="lastLogin">Loading...</span></div>
    <a href="profile.html" class="back-link">← Back to Profile</a>
  </div>
  <script src="js/config.js"></script>
  <script>
    // ------------------ Get logged-in user's email ------------------
    const params = new URLSearchParams(window.location.search);
    const email = params.get("email");

    (async function(){
      if (!email) {
        alert("❌ No user specified!");
        return;
      }

      try {
        const data = await makeRequest(API_CONFIG.ENDPOINTS.ACCOUNT_DETAILS + '?email=' + encodeURIComponent(email));
        if (data && data.success && data.user) {
          document.getElementById('username').textContent = data.user.name;
          document.getElementById('lastLogin').textContent = data.user.lastLogin || 'N/A';
        } else {
          alert("⚠️ Could not fetch account details.");
        }
      } catch (err) {
        console.error("❌ Error fetching account details:", err);
        alert("❌ Failed to load account details. Check console for details.");
      }
    })();
  </script>

</body>
</html>
