login code "<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Audit Cell Login - MGU Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; height: 100vh; background: linear-gradient(135deg, #4facfe, #9b59b6, #e056fd); }
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(210deg, rgba(255,255,255,0.05) 25%, transparent 25%),
                  linear-gradient(120deg, rgba(255,255,255,0.05) 25%, transparent 25%);
      background-size: 300px 300px;
      mix-blend-mode: overlay;
      pointer-events: none;
    }
    .mgu-header { width: 100%; background-color: #fff; text-align: center; padding: 15px 0; }
    .mgu-header h1 { color: #0047b3; font-size: 24px; margin-bottom: 5px; }
    .mgu-header p { color: #666; font-size: 14px; }
    .audit-bar { background-color:#0047b3; text-align: center; padding: 10px; }
    .audit-bar span { color: white; font-weight: bold; font-size: 18px; letter-spacing: 1px; }
    .login-section { flex: 1; display: flex; justify-content: center; align-items: center; padding: 30px; }
    .login-card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 30px 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); width: 100%; max-width: 360px; text-align: center; color: white; }
    .input-group { position: relative; margin-bottom: 20px; }
    .input-group input { width: 100%; padding: 12px 40px 12px 12px; border: none; border-radius: 8px; font-size: 14px; outline: none; }
    .input-group i { position: absolute; top: 50%; right: 12px; transform: translateY(-50%); color: #555; }
    .error-msg { color: #ff6666; font-size: 14px; margin-bottom: 10px; display: none; }
    .forgot-password { display: block; text-align: right; margin-bottom: 15px; font-size: 12px; color: white; text-decoration: none; }
    .forgot-password:hover { text-decoration: underline; }
    .login-btn { width: 100%; padding: 12px; background-color: #87CEFA; border: none; color: white; font-size: 16px; border-radius: 8px; cursor: pointer; transition: background 0.3s ease; }
    .login-btn:hover { background-color: #1E90FF; }
    .register-link { margin-top: 15px; font-size: 14px; }
    .register-link a { color: #ffcc66; text-decoration: none; font-weight: bold; }
    .register-link a:hover { text-decoration: underline; }
    @media (max-width: 480px) { .login-card { padding: 20px 15px; } }
  </style>
</head>
<body>

  <div class="mgu-header">
    <h1>Mahatma Gandhi University</h1>
    <p>Academic Audit System</p>
  </div>

  <div class="audit-bar">
    <span>AUTOMATED ACADEMIC AUDITING SYSTEM</span>
  </div>

  <div class="login-section">
    <div class="login-card">
      <div class="input-group">
        <input type="text" id="email" placeholder="Email">
        <i>&#128100;</i>
      </div>
      <div class="input-group">
        <input type="password" id="password" placeholder="Password" required>
        <i>&#128274;</i>
      </div>

      <!-- Error message placeholder -->
      <div id="error-msg" class="error-msg">Invalid username or password</div>

      <a href="#" class="forgot-password" onclick="forgotPassword()">Forgot Password?</a>
      <button class="login-btn" onclick="login()">Login</button>
      <!-- Register -->
      <div class="register-link">
          Don't have an account? <a href="register.html">REGISTER</a>
      </div>

    </div>
  </div>

  


  <!-- Import config.js -->
  <script src="js/config.js"></script>
  
  <script>
    // Add loading indicator
    function showLoading(show) {
      const loginBtn = document.querySelector('.login-btn');
      if (show) {
        loginBtn.disabled = true;
        loginBtn.textContent = 'Logging in...';
        loginBtn.style.backgroundColor = '#ccc';
      } else {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
        loginBtn.style.backgroundColor = '#87CEFA';
      }
    }

    // Show error message
    function showError(message) {
      const errorDiv = document.getElementById('error-msg');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
    }

    // Hide error message
    function hideError() {
      const errorDiv = document.getElementById('error-msg');
      errorDiv.style.display = 'none';
    }

    // Validate email format
    function isValidEmail(email) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email);
    }
    
    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      
      hideError(); // hide previous errors
      
      // Validate inputs
      if (!email || !password) {
        showError('Please enter both email and password.');
        return;
      }

      if (!isValidEmail(email)) {
        showError('Please enter a valid email address.');
        return;
      }

      showLoading(true);

      try {
        console.log('Making login request...'); // Debug log
        const data = await makeRequest(API_CONFIG.ENDPOINTS.LOGIN, 'POST', { email, password });
        console.log('Login response:', data); // Debug log

        if (data && data.success) {
          hideError();
          
          // Save user data in localStorage
          const userObj = {
            id: data.user?.id,
            email: data.user?.email || email,
            name: data.user?.name || '',
            role: data.role || 'user'
          };
          
          if (data.token) userObj.token = data.token;
          localStorage.setItem('user', JSON.stringify(userObj));

          // Redirect based on role
          const redirectMap = {
            'admin': 'admindashboard.html',
            'inspect': 'inspectdash.html',
            'user': 'dashboard.html'
          };

          const redirectUrl = redirectMap[data.role] || 'dashboard.html';
          console.log(`Redirecting to ${redirectUrl}`); // Debug log
          window.location.href = redirectUrl;
        } else {
          showError((data && data.message) ? data.message : 'Invalid username or password');
        }
      } catch (err) {
        console.error('Login error:', err);
        showError(err.message || 'Server error. Please try again later.');
      } finally {
        showLoading(false);
      }
    }
    
    // Handle any connection errors
    function handleConnectionError(error) {
      console.error('Connection error:', error);
      showError('Unable to connect to server. Please try again later.');
      showLoading(false);
    }
    
    function forgotPassword() {
      window.location.href = 'forgot.html';
    }
    
    // Clear any stored login data on page load
    window.addEventListener('load', function() {
      localStorage.removeItem('user');
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
      hideError();
    });
    
    // Allow form submission on Enter key
    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        login();
      }
    });

    // Prevent browser from showing old cached version
    window.addEventListener('pageshow', function (event) {
      if (event.persisted || performance.getEntriesByType("navigation")[0].type === "back_forward") {
        window.location.reload();
      }
    });
  </script>

</body>
</html
