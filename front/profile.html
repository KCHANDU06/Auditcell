<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Audit Cell - Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { 
      margin: 0; 
      height: 100vh; 
      background: linear-gradient(135deg, #4facfe, #9b59b6, #e056fd);
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      color: white; 
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(210deg, rgba(255,255,255,0.05) 25%, transparent 25%),
                  linear-gradient(120deg, rgba(255,255,255,0.05) 25%, transparent 25%);
      background-size: 300px 300px;
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    /* Top-right links */
    .top-links {
      position: absolute;
      top: 20px;
      right: 30px;
      display: flex;
      gap: 20px;
      z-index: 2;
    }
    .top-links a {
      color: #fff;
      text-decoration: underline;
      font-weight: bold;
      transition: color 0.3s;
    }
    .top-links a:hover {
      color: #87CEFA;
    }

    .team-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      z-index: 1;
    }
    .member-card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      width: 260px;
      text-align: center;
      transition: transform 0.3s ease;
    }
    .member-card:hover { transform: scale(1.05); }
    .member-card img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
    }
    .member-card h3 { margin-bottom: 4px; color: #fff; }
    .member-card p { color: #f0f0f0; font-size: 14px; }
  </style>
</head>
<body>

  <!-- Top-right links -->
  <div class="top-links">
<a href="account.html">Account Details</a>
<a href="activity.html">Activity Summary</a>

  </div>

  <div class="team-container">
    <div class="member-card">
      <img src="D:\AUDIT\Prashanthi.webp" alt="Director">
      <h3>Dr.Y.Prashanthi</h3>
      <p>Director</p>
    </div>
    <div class="member-card">
      <img src="D:\AUDIT\Jayanthi1.webp" alt="Dean">
      <h3>Dr.M.Jayanthi</h3>
      <p>Assistant Director</p>
    </div>
    <div class="member-card">
      <img src="D:\AUDIT\AMARENDER.webp" alt="Coordinator">
      <h3>Mr.K.Amerender</h3>
      <p>Coordinator</p>
    </div>
  </div>

</body>
</html>
