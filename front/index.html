<html>
<head>
  <title>Mahatma Gandhi University</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #1976d2, #64b5f6);
    }

    /* Top Banner */
    .top-bar {
      background: #f5f5f5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-section img {
      height: 60px;
    }

    .logo-section .title {
      font-size: 18px;
      font-weight: bold;
      color: #1a237e;
    }

    .logo-section .subtitle {
      font-size: 14px;
      color: #b71c1c;
    }

    .quote-section {
      text-align: right;
      font-size: 14px;
      color: #333;
    }

    .quote-section img {
      height: 50px;
      margin-left: 10px;
    }

    /* Navigation */
    nav {
      background: #1976d2;
      text-align: right;
      padding: 12px 40px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 30px;
      font-weight: bold;
      transition: 0.3s;
    }

    nav a:hover {
      color: #ffeb3b;
    }

    /* Main Section */
    .main-image {
      text-align: center;
      margin: 20px 0;
    }

    .main-image img {
      width: 95%;
      max-width: 1200px;
      border-radius: 6px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    /* Audit Heading */
    .audit-heading {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #1a237e;
      margin-top: 30px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
    }

    /* Login Links */
    .login-links {
      text-align: center;
      margin: 25px 0 40px;
    }

    .login-links a {
      display: inline-block;
      margin: 0 20px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      text-decoration: none;
      background: #1976d2;
      padding: 10px 25px;
      border-radius: 6px;
      transition: background 0.3s;
    }

    .login-links a:hover {
      background: #0d47a1;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="logo-section">
      <img src="D:\AUDITCELL\front\mgu logo.jpg" alt="MGU Logo">
      <div>
        <div class="title">Mahatma Gandhi University</div>
        <div class="subtitle">The University Motto is 'Academic Excellence'<br>
          Re-accredited with 'B+' grade by NAAC</div>
      </div>
    </div>
    <div class="quote-section">
      <em>“Live as if you were to die tomorrow. Learn as if you were to live forever.”</em><br>
      <strong>- Mahatma Gandhi</strong>
      <img src="https://upload.wikimedia.org/wikipedia/commons/d/d1/Portrait_Gandhi.jpg" alt="Gandhi">
    </div>
  </div>

  <!-- Audit Cell Heading -->
  <div class="audit-heading">AUDIT CELL</div>

  <!-- Main Image -->
  <div class="main-image">
    <img src="University.jpg" alt="University">
  </div>

  <!-- Login Links -->
  <div class="login-links">
    <a href="login.html">Login</a>
 
  </div>

</body>
</html>
